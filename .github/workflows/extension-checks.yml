name: Extension checks
on:
  pull_request:
  push:
    branches: [main, security/lan-compatible-hardening]
permissions:
  contents: read
jobs:
  extension:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install pytest playwright==1.65.2
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest -q tests
      - name: JavaScript checks and Firefox package
        run: |
          for test in tests/test_*.js; do node "$test"; done
          for script in *.js; do node --check "$script"; done
          sh -n build-firefox.sh
          sh build-firefox.sh
